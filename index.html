<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qiaoqi Li | Academic Homepage</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2937;
      --muted: #5b6778;
      --light: #eef2f6;
      --line: #d9e0e8;
      --blue: #174a7c;
      --blue-soft: #edf5fb;
      --green: #267465;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.65;
    }

    a {
      color: var(--blue);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 38px 28px 70px;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 54px;
    }

    .sidebar {
      padding-top: 18px;
    }

    .profile {
      position: sticky;
      top: 28px;
    }

    .avatar {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin-bottom: 20px;
      color: #fff;
      background: linear-gradient(135deg, #174a7c, #267465);
      font-size: 40px;
      font-weight: 700;
    }

    .name {
      margin: 0;
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .name-cn {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 18px;
    }

    .position {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 16px;
    }

    .affiliation {
      margin: 8px 0 0;
      font-size: 15px;
    }

    .side-links {
